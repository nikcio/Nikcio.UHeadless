name: Check docs and examples

on:
  push:
    branches: [ "contrib" ]
    paths:
      - 'docs/**'
      - 'examples/nextjs-example/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "contrib" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # pnpm verifies the committed lockfile against the supply-chain policies
      # (e.g. minimumReleaseAge) on every install. Pin the same pnpm version as
      # package.json's packageManager field so local installs and CI resolve
      # with the same pnpm instead of whatever pnpm@latest ships that day.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0

      # A frozen install uses the committed pnpm-lock.yaml as-is and fails if
      # it is out of sync with the manifests or violates supply-chain policies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build docs
        run: pnpm --filter docs build
