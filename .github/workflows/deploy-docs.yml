name: Deploy docs to GitHub Pages

on:
  push:
    branches: [ "contrib" ]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm verifies the committed lockfile against the supply-chain policies
      # (e.g. minimumReleaseAge) on every install. Pin pnpm via corepack so the
      # same policy-enforcing version is used here as everywhere else.
      - name: Setup pnpm
        uses: pnpm/action-setup@41ff64de8b7729a34864f6f460a2ebd63a52bf95 # v4.7.0
        with:
          version: 12.16.1

      - name: Install, build, and upload your site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: docs
          node-version: 24
          package-manager: pnpm@12.16.1
          build-cmd: pnpm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
