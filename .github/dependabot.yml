version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-nuget)"
    ignore:
      - dependency-name: "Umbraco.Cms.Web.Common"
      - dependency-name: "Umbraco.Cms.Web.Website"
      - dependency-name: "Umbraco.Cms.Web.Backoffice"
    groups:
      testing:
        patterns:
          - "xunit.v3"
          - "xunit.runner.visualstudio"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.collector"
      hotchocolate:
        patterns:
          - "HotChocolate.*"

  # pnpm workspace root. All workspace packages (root, /docs,
  # /examples/nextjs-example) share pnpm-lock.yaml, so Dependabot must run
  # from the workspace root for lockfile updates to land together with the
  # package.json updates they belong to.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: increase
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      biome:
        patterns:
          - "@biomejs/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-ci)"
    groups:
      actions:
        patterns:
          - "*"
